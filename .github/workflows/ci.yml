name: ci
on:
  push:
  pull_request:

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go build -o brains-test ./cmd/brains
      - run: ./brains-test doctor
        shell: bash
